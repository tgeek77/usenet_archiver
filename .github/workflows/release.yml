name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zipapp:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build zipapp + tarball
        run: |
          chmod +x scripts/build_zipapp.sh bin/usenet-archiver
          ./scripts/build_zipapp.sh
          ./dist/usenet-archiver -c --help | head -n 5

      - name: Upload zipapp tarball
        uses: actions/upload-artifact@v4
        with:
          name: zipapp-tarball
          path: dist/usenet-archiver-*-zipapp.tar.gz

  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-tk libfuse2 wget file

      - name: Build zipapp + AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          chmod +x scripts/build_zipapp.sh scripts/build_appimage.sh bin/usenet-archiver
          ./scripts/build_zipapp.sh
          ./scripts/build_appimage.sh
          # Smoke-test CLI path inside AppImage (no display needed)
          ./dist/Usenet_Archiver-*-x86_64.AppImage -c --help | head -n 5

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/Usenet_Archiver-*.AppImage

  release:
    needs: [zipapp, appimage]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.AppImage' -o -name '*-zipapp.tar.gz' \) -exec cp -v {} release/ \;
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
